# self-tests と repository checks を PR / push ごとに実行する。
# scripts は macOS 標準 Ruby 前提なので macOS runner を使う。
# 外部 dependency の install と secrets は不要。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: macos-latest
    # 実測 (2026-11-13〜16 の 82 run): system は中央値 15.5 分・最長 19.2 分、3.4 は中央値 12.3 分・最長 15.5 分。
    # 20 分の上限では、system が最後の test の途中で打ち切られた回があった。残りの step を足すと約 21 分の見込み (#699)。
    # 遅い回は、ほぼすべての test が同じ割合で伸びる (runner の速さの揺れ。特定の test の待ちではない)。
    # 上限は、最長の約 21 分の 1.5 倍 (31.5 分) を 5 分の単位で切り上げた 35 分 (#645 で 15 分から 20 分に上げていた)。
    # 最長が上限の 2/3 (約 23 分) を超えたら見直す。test ごとの秒は「Run self-tests」の log の末尾にある。
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # system = Apple 標準 Ruby /usr/bin/ruby (2.6 / psych 3) が配備先の床。3.4 は
        # yaml_util.rb の psych >= 4 分岐を CI の dead path にしないための現行 Ruby (#150)。
        # runner イメージの PATH ruby は既に 3.x (2026-07-10 実測 3.4.9) なので、system 行は
        # PATH 任せにせず /usr/bin/ruby へ shim で pin する (#176 Low)。
        ruby: [system, "3.4"]
    steps:
      # 外部 action は full commit SHA で pin する (タグ移動による差し替え対策)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # テストが repo 内の scripts を実行するため、token を .git/config に残さない。
          persist-credentials: false

      # scripts/*.sh は PATH の ruby を exec するため、PATH 先頭を差し替えるだけで
      # matrix の Ruby に切り替わる。system 行では何もしない (macOS 標準 Ruby のまま)。
      - name: Set up Ruby ${{ matrix.ruby }}
        if: matrix.ruby != 'system'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}

      # system 行の存在理由は「配備先の床 = psych < 4 (現に 2.6 / psych 3)」の検証。
      # scripts/*.sh は PATH の ruby を exec するため、PATH 先頭に /usr/bin/ruby への
      # shim を置いて Apple 標準 Ruby に固定する (runner の PATH ruby は 3.x に更新済みで、
      # PATH 任せだと床の検証が黙って消える — 本 PR の CI で実際に検出)。
      - name: Pin system row to Apple system Ruby (/usr/bin/ruby)
        if: matrix.ruby == 'system'
        run: |
          test -x /usr/bin/ruby || { echo "::error::/usr/bin/ruby is gone; revisit the CI matrix (#176)"; exit 1; }
          shim="$RUNNER_TEMP/system-ruby-shim"
          mkdir -p "$shim"
          ln -s /usr/bin/ruby "$shim/ruby"
          echo "$shim" >> "$GITHUB_PATH"

      # macOS の更新で /usr/bin/ruby が psych >= 4 になると床側の分岐が dead path 化する
      # (両行とも psych >= 4) ため、前提が崩れた時点で CI を落として matrix の見直しを迫る
      # (#176 Low)。
      - name: Assert system Ruby is the psych 3 floor
        if: matrix.ruby == 'system'
        run: |
          ruby -rpsych -e 'v = Psych::VERSION; puts "system ruby #{RUBY_VERSION} / psych #{v}"
            abort "system Ruby is no longer the psych <4 floor; revisit the CI matrix (#176)" \
              unless v.split(".").first.to_i < 4'

      # node は runner image のものを使う (setup-node は足さない。#583)。版を log に残し、test が使う機能の
      # 下限 (`node --test` = 18.1、node:test = 18.0、Object.hasOwn = 16.9) より古ければ CI を落として見直しを迫る。
      - name: Assert runner Node meets the test floor
        run: |
          command -v node >/dev/null 2>&1 || { echo "::error::node is not on PATH; the plugin and safe-run tests need it (#583)"; exit 1; }
          node -e 'const v = process.versions.node; console.log(`runner node ${v}`);
            const [major, minor] = v.split(".").map(Number);
            if (major < 18 || (major === 18 && minor < 1)) { console.log(`::error::runner node ${v} is below the test floor 18.1 (#583)`); process.exit(1); }'

      - name: Run self-tests
        run: |
          # runner は、最初の失敗で止めずに全 test を走らせ (1 回の CI で全失敗を可視化する)、最後に遅い順の 10 本と合計を
          # 出す (上限の見直しに使う。#699)。3 本ずつ並べるのは、runner が 3 core のため (#726)。job を分けると必要な check の
          # 名前が変わり、macOS の runner も多く要るので、job の中で並べる。
          # 手元に local の断片がある環境を模す (#689)。sync と doctor が読む場所に、不正な断片 (指す先の無い symlink) を
          # この step の間だけ置く。XDG_CONFIG_HOME を一時 dir に向けずに断片を読む test は、sync の conflict か doctor の
          # fail で落ちる。後の step (doctor を空の home で走らせる) には残さない。
          case "${XDG_CONFIG_HOME:-}" in /*) xdg="$XDG_CONFIG_HOME" ;; *) xdg="$HOME/.config" ;; esac
          fragment="$xdg/agent-tools/instructions.local.md"
          if [ -e "$fragment" ] || [ -L "$fragment" ]; then echo "::error::$fragment already exists on the runner (#689)"; exit 1; fi
          mkdir -p "$xdg/agent-tools"
          ln -s "$RUNNER_TEMP/no-such-local-instructions" "$fragment"
          trap 'rm -f "$fragment"' EXIT
          ruby scripts/tests/lib/run-all.rb --jobs 3

      # 偽の HOME の下に置いた canary で、書き込み経路を持つ suite (sync / setup / root-default)
      # が実物の ~/.config/opencode を触らないことを確かめる (#295)。tests/lib/ は上の runner に
      # 乗らないので別 step で呼ぶ。
      - name: Run opencode home canary
        run: scripts/tests/lib/opencode-home-canary.sh

      - name: Check repository assets
        run: |
          scripts/check-manifests.sh
          # high (exit 1) / usage (exit 2) は fail。medium (exit 3) は human_review:approved
          # を register が gate するため、ここでは許容する (照合は register step が担う)。
          scripts/check-injection.sh || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; }

      - name: Build, register, and report status
        run: |
          scripts/build.sh
          scripts/register.sh
          # status / doctor は runner の実 ~/.codex 等を読まないよう空 home を渡す
          # (環境依存の結果を避ける。CI では build/register の健全性だけ見る)。
          homes="$RUNNER_TEMP/emptyhomes"
          mkdir -p "$homes/codex" "$homes/claude" "$homes/opencode" "$homes/agents"
          scripts/status.sh --json --codex-home "$homes/codex" --claude-home "$homes/claude" \
            --opencode-home "$homes/opencode"
          scripts/doctor.sh --codex-home "$homes/codex" --claude-home "$homes/claude" \
            --opencode-home "$homes/opencode" --agents-home "$homes/agents"
