summary: run a budget-sized repository maintenance audit, have the other AI refute it, then deduplicate, file, and record findings
description: "Outcome: one budget-sized maintenance run (audit, cross-AI refutation, dedupe, filing, record), and on explicit request a fix pass that turns the sweep's own uncontested docs-drift findings into PRs. Trigger: explicit only (skill name, audit plus filing, fixing the sweep's own filed findings, or spending remaining quota). Use: periodic repository upkeep with GitHub issues. Do not use: report-only audits (personal-repo-audit), a single bug or a plain fix request (personal-investigate), or PR review (personal-review-request). Side effects: read-only audit and refutation; GitHub issue writes in issues mode; in fix mode, docs edits in a linked worktree under the run dir, branch pushes, PR creation, and review comments; local state. Compose with: personal-repo-audit for diagnosis, personal-project-operating-loop for quota readouts, and personal-review-request for fix-mode reviews."
