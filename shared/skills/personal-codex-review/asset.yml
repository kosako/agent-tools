summary: run a capability-checked read-only Codex review executor launched from a herdr pane and return findings from a result file without repo or GitHub side effects (the Codex session rollout is kept for usage accounting)
description: "Outcome: return a Codex review of a branch, commit, or uncommitted change. Trigger: an explicit Codex second opinion or verified Claude-authored cross-review route. Use: repo-bound read-only review. Do not use: GitHub lifecycle or Codex-authored independent review; verified Codex authors return to Claude, while mixed/unknown authors need human adjudication. Side effects: read-only CLI execution launched from a herdr pane (direct launch only when the caller is verifiably unsandboxed, otherwise BLOCKED with a manual hand-off), result read from a file, no repo or GitHub writes, Codex session rollout kept for usage accounting; capability gaps block without generic fallback and second opinions stay non-independent. Compose with: personal-review-request and personal-production-rail."
review:
