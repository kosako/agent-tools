schema_version: 1
name: personal-git-identity-gate
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #281 の実装 PR で author≠reviewer レビューのうえ承認。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:cd8912d9d6e7e89c5ba56ac16c11025c678193197b8adeb78a6c5b4b4a27d95e
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-git-identity-gate.rb
  format: text
summary: >-
  pre-commit / pre-merge-commit / prepare-commit-msg stage の git gate (#449)。git var で解決した author /
  committer の identity が name / email とも非空であることを検証し、partial な identity (Git が受理してしまう
  空 email) の commit を block する。identity の値は出力せず key 名だけを出す。context 一致は検査しない
  (dotfiles 側の layout 規約に依存するため)。best-effort guardrail で、repo local の core.hooksPath、git am と
  rebase の apply backend (どちらも 3 stage が走らない) では迂回される。--no-verify は prepare-commit-msg を
  skip しないので迂回できない (docs/git-hook-gates.md)。dispatcher の pre-commit 2 本目 (public-safety の後) と、
  pre-merge-commit・prepare-commit-msg の唯一の gate。
