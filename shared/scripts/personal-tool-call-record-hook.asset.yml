schema_version: 1
name: personal-tool-call-record-hook
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  # 実行時に tool 呼び出しの記録 (tool 名・引数の key・session_id) をユーザーの state dir に書く。
  # 値は書かないが、記録そのものが private な runtime state なので medium。
  privacy: medium
# script kind は実行コード配布のため常に human review 必須 (#147)。承認は内容と配布形態に紐づく
# (#148, #184)。本 script の review block は #454 の PR で author≠reviewer レビューののち、人が
# approved_build_id を入れる。それまで register は human_review_required とし sync は配備しない。
review:
  human_review: approved
  approved_build_id: sha256:5bea77bf6b4f59c22074ef6e525abddaa0ee659257409cbe444da97df1d50f8b
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-tool-call-record-hook.rb
  format: text
summary: >-
  SessionStart / PreToolUse / PostToolUse / PostToolUseFailure / PermissionDenied hook body。
  event ごとに 1 行の JSON (時刻・client・session・tool 名・引数の key・結果の印) をユーザーの
  state dir の JSONL に追記する記録 hook。判断しない・stdout 無し・exit 0 固定 (fail-open)。
  引数の値・tool_response・path は書かない (例外は PermissionDenied の reason の先頭 200 字で、
  client が作る自由文のため値や path を含みうる)。主体は client の自己申告まで (guardrail であって
  境界ではない)。docs/tool-call-record-hook.md が正本。
