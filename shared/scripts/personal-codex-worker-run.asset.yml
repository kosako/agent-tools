summary: >-
  Codex worker の起動を 1 command にまとめる (#706)。launch は packet の起動記録と workspace を検査し、
  snapshot を照合して clone を再利用する。preflight の launch_argv から brief と run script を作り、
  packet に記録してから herdr の Issue tab で起動する。停止の区分は JSON で返す。
  collect は結果の転記と停止時の退避、retry-empty は空の結果の再実行を行う。
  check は回収済みの commit と公開先を検査し、検査した head OID を返す。
  GitHub は公開先と owner の判定のために読み取る。push と PR 作成は指揮役が行う。
