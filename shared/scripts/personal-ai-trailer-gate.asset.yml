schema_version: 1
name: personal-ai-trailer-gate
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #202 (Phase 1) の実装 PR で author≠reviewer レビューのうえ承認し、
# #295 PR 3a (OpenCode) で再レビューする。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:b1db7d628863efc9e304a08c70a47d6ec683d99280d351e99da1de33c060c3b5
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-ai-trailer-gate.rb
  format: text
summary: >-
  commit-msg stage の git gate。AI agent セッション由来 (env marker: CLAUDECODE / CODEX_* /
  AGENT_TOOLS_OPENCODE。最後のものは OpenCode の plugin が model の bash に立てる) の commit に
  相互レビュー routing の正本 Co-Authored-By トレーラを要求する (欠落 / Claude・Codex・OpenCode の
  混在 / 非 no-reply email / OpenCode の name の形の不正 / 1 commit に model の異なる OpenCode を block)。
  人間 commit と merge commit は無言 pass の opt-in 設計。squash / rebase での喪失は消費側 preflight の
  領分 (docs/git-hook-gates.md)。
