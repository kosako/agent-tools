schema_version: 1
name: personal-work-marker-check
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #661 の PR で author≠reviewer レビューのうえ承認。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:3db0390b8383f5fb3b2531bb49d19c14a53315a9a412f55558d2d02d034f51c3
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-work-marker-check.rb
  format: text
summary: >-
  計測が読む目印 (docs/work-markers.md の v2) の形を、投稿の前に確かめる (#661)。--kind pr は 1 行目の PR の題と、空行の後の
  本文を読み、題の末尾の (#<番号>) か、本文の行の先頭からの「Closes #<番号>」の行の少なくとも一方で Issue と紐付き、両方
  あれば番号が合うことを確かめる (決まった形の外の closing keyword は note で知らせる)。どの kind も Markdown を解釈せず、
  決まった形の行を行の先頭から読み、code block の中でも数える。--kind review-result は結果コメントの決まった
  3 行 (見出し・Review process verdict・Finding summary) が行の先頭からちょうど 1 回ずつあり、verdict が finding の数と合う
  ことを、--kind escape-issue は「元の PR: #<番号>」の行がちょうど 1 回あることを確かめる。入力は --stdin だけ (UTF-8、1 MiB
  まで)。何も書かず、network に触れず、出力に入力の本文を載せない。exit 0 = 形が合う / 1 = 形が崩れている (投稿しない) /
  2 = usage・入力を読めない・想定外の例外。目印は個人 project にだけ当て、ほかの repo ではその repo の template に合わせる
  (docs/work-markers.md の「対象」)。
