schema_version: 1
name: personal-ci-check
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #541 の 1 番目の PR (workflow の file の静的な検査) で author≠reviewer レビューのうえ承認し、3 番目の
# PR (--since の run の記録の点検) で再レビューする。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:c60094c4bac1b8c3c6de048b8168015d206ac26cd5bc15fde89425c54bc5529e
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-ci-check.rb
  format: text
summary: >-
  GitHub Actions の workflow の file を決まった規則で検査し、所見を personal-repo-audit の findings.schema.json の形の
  JSON で stdout に出す (#541)。AI を使わず、何も書かない。既定では GitHub にも network にも触れず (git を
  --no-lazy-fetch と --no-replace-objects で起動し、今の directory の repo の HEAD の commit の実体を読むだけ。作業
  ツリーの未 commit の変更は読まない)、--since を付けたときだけ gh api (GET。shell を通さず GH_REPO を外す) で窓
  (since, until] に終わった run の記録を点検する: job-timed-out (cancelled + 決まった annotation)、flaky-rerun (同じ job
  が failure の後の attempt で success、窓の中で 2 本以上の run)、deprecation-* (default branch への push の run の
  annotation の決まった語。文面は載せず、決まった型だけを決まった文言に)。Dependabot などの dynamic な run は見ない。
  一覧は作成が [since の 7 日前, until] の run を total_count と突き合わせて読み、job はやり直した run・cancelled /
  failure / timed_out の run・まだ終わっていない run だけを読む。応答の key の欠けや、終わった run と job の値の欠けは
  確かめられないにする。API は 1 回の実行で 200 回・120 秒まで (超えた gh は、出力の pipe を握る子を含めて process
  group ごと止める)。点検に失敗したら点検の所見は捨て、
  scope.not_seen に「run の記録」の行を書いて exit 2。対象は
  .github/workflows/ の直下の *.yml / *.yaml。規則は timeout-missing (job に timeout-minutes が無い。reusable workflow
  を呼ぶ job は書けないので見ない) と concurrency-missing (pull_request で起動する workflow に、top level にもすべての
  job にも concurrency が無い。proposal で判断が要る)。YAML は stream 全体を parse して文書が 1 つであることを求め、
  AST を作る前に入れ子の深さ (64 段まで。parse の event で数える) を、load の前に明示の tag と scalar でない key と
  merge key を、load の後に書かれた key と load 後の key が 1 対 1 でない形 (重なる key、解決で衝突する key) を拒む。
  .github/workflows/ の subdirectory は名前によらず見ない。出力に載せるのは
  規則の形に合う file と job の名前と決まった文言だけ。repo を選ぶ git の環境変数を継承していれば止める。exit 0 = 所見
  なし / 1 = 所見あり / 2 = usage・repo や HEAD を解決できない・git の失敗・想定外の例外・確かめられない file が有る
  (YAML として読めない、文書が 1 つでない、key が書かれたとおりに読めない、workflow の形でない、通常の file でない、
  1 MiB を超える、名前が規則の外。残りの file は確かめて出す) (docs/ci-check.md)。
