schema_version: 1
name: personal-ci-check
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #541 の 1 番目の PR (workflow の file の静的な検査) で author≠reviewer レビューのうえ承認する。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:4423a9370e1fe7503fa4fec7b2bc5b1fdeee173d07e44f6646d9d3c7a6c215af
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-ci-check.rb
  format: text
summary: >-
  GitHub Actions の workflow の file を決まった規則で検査し、所見を personal-repo-audit の findings.schema.json の形の
  JSON で stdout に出す (#541)。AI を使わず、GitHub にも network にも触れず (git で今の directory の repo の HEAD の
  commit を読むだけ。作業ツリーの未 commit の変更は読まない)、何も書かない。対象は .github/workflows/ の直下の *.yml /
  *.yaml。規則は timeout-missing (job に timeout-minutes が無い。reusable workflow を呼ぶ job は書けないので見ない) と
  concurrency-missing (pull_request で起動する workflow に、top level にもすべての job にも concurrency が無い。proposal
  で判断が要る)。出力に載せるのは規則の形に合う file と job の名前と決まった文言だけ。repo を選ぶ git の環境変数を
  継承していれば止める。exit 0 = 所見なし / 1 = 所見あり / 2 = usage・repo や HEAD を解決できない・確かめられない
  file が有る (YAML として読めない、workflow の形でない、通常の file でない、1 MiB を超える、名前が規則の外。残りの
  file は確かめて出す) (docs/ci-check.md)。
