schema_version: 1
name: personal-git-hook-dispatcher
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #202 (Phase 1) の実装 PR で author≠reviewer レビューのうえ承認。
# #267 (引数ゼロでの shell 経由起動の修正) で body を変更し、同じく author≠reviewer
# レビューのうえ approved_build_id を焼き直した。
# #274 (例外 / gate 起動失敗の exit code 正規化) で body を変更し、同じく author≠reviewer
# レビューのうえ approved_build_id を焼き直した。
# #281 (pre-commit に git-identity gate を追加) で STAGE_GATES を変更し、同じく author≠reviewer
# レビューのうえ approved_build_id を焼き直した。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:92a5243e240e85fcd74f9cf72f45f1de954fbe9e4c3c1f20625f1babbf22132c
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-git-hook-dispatcher.rb
  format: text
summary: >-
  global core.hooksPath から呼ばれる git hook の入口。stage (pre-commit / commit-msg / pre-merge-commit /
  prepare-commit-msg。後の 2 つは git-identity だけ。#449) ごとの personal gate を実行し、全 pass なら repo 自身の
  hooks/<stage> に chain して「置換」を「合成」に変える (#201 裁定)。gate の無い stage (git の既知の hook 名) は
  chain だけを行う素通し (#430 の 3。素通しに使えない stage と未知の名前は exit 2)。best-effort guardrail で
  --no-verify (pre-commit / commit-msg / pre-merge-commit を skip する。prepare-commit-msg は skip しない) や repo
  local の core.hooksPath で迂回可能 (docs/git-hook-gates.md)。登録・配線 (shim + git config) は dotfiles 所有。
