schema_version: 1
name: personal-packet
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #253 PR-2 の実装 PR で author≠reviewer レビューのうえ承認。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:ad1c2e3fb4f106706f021fca819edb47191187add50fc7ce5b1bc3eed5f005d1
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-packet.rb
  format: text
summary: >-
  作業単位 (Issue) ごとの packet .agent-packets/<issue>.md を扱う CLI。dir (main worktree root に
  固定) / list (frontmatter の一覧、--json) / publish (結果の最新節 + 次の入口を marker 付きで
  Issue コメントへ写す。同じ directory の personal-public-safety-gate --stdin が exit 0 のときだけ
  投稿し、gh に到達できなければ exit 2 で Claude か人に渡す) / pull (personal-safe-gh の self
  コメントから検証できる写しを取り込み、local packet を再構成。--dry-run で全文を表示)。
  規約は docs/agent-packets.md。
