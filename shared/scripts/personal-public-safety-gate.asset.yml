schema_version: 1
name: personal-public-safety-gate
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は #202 (Phase 1) の実装 PR で author≠reviewer レビューのうえ承認。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:f6a7830aaf52eb0760105de1bc0af88fd1fcfcdb2565c7a313a5a624c2ab7801
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-public-safety-gate.rb
  format: text
summary: >-
  公開する内容を公開の前に検査する gate。pre-commit stage では staged diff の追加行から secret
  (private key / 既知 token 形) / 実 home path / 個人用 local file (*.local / .agent-packets/)
  を検出して commit を block する (definite) か警告する (suspicious)。commit-msg stage でも
  --commit-msg で commit message の file を同じ pattern で検査する (#413)。--stdin で同じ pattern
  により text を検査する (Issue / PR / コメントの題名と本文を投稿する前と、push で公開される内容を
  push する前の検査口。packet の public 写しもここを通す。#253 #413)。値そのものは出力しない。私物パターンは
  untracked の ~/.config/agent-tools/public-safety-patterns.local から読む。best-effort guardrail
  (docs/git-hook-gates.md)。
