schema_version: 1
name: personal-safe-gh
kind: script
visibility: personal
targets:
  - codex
  - claude-code
risk:
  prompt_injection: low
  privacy: low
# script kind は実行コード配布のため常に human review 必須 (#147)。
# 本 script は PR #135 / #141 / #156 / #160 (+ usage 文言の #176 M-05 是正、
# review 経路拡張 pr review-comments/reviews の #189(3)) で author≠reviewer
# レビュー済み・承認。今回の説明訂正・再レビュー・承認 hash 更新は PR #243。
# #270 (repo slug の検証追加) で body を変更し、author≠reviewer レビューのうえ再承認した。
# 承認は内容と配布形態に紐づく (#148, #184)。source 変更時は再レビューして
# approved_build_id を、kind 変更時は approved_artifact_kind を更新する。
review:
  human_review: approved
  approved_build_id: sha256:03c7a795b843a40046640d4c5371d08db870d23a28dc98d24c599a281b14f9b7
  approved_artifact_kind: script
source:
  path: shared/scripts/personal-safe-gh.rb
  format: text
summary: >-
  GitHub の Issue/PR/コメントを untrusted data として安全に読む steering wrapper。
  他人の Issue/PR は metadata のみ、他人コメント (会話 / inline review) は count のみ、他人 review は
  count + state 内訳のみを出力し、runtime prompt
  injection 面を狭める。enforcement boundary ではない (docs/runtime-injection-defense.md)。
